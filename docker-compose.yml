services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wagering_network

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      DEBUG: "0"
      PERSISTENCE: "1"
    ports:
      - "4566:4566"
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    networks:
      - wagering_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering_dev
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - wagering_network

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/consumers/main.ts"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering_dev
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - wagering_network

  workers:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "src/workers/main.ts"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: wagering
      DB_USER: wagering
      DB_PASSWORD: wagering_dev
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - wagering_network

volumes:
  postgres_data:
  localstack_data:

networks:
  wagering_network:
    driver: bridge